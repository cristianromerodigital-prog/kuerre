<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitados</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d0f;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;padding:24px 16px}
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap');
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:28px;color:#c9a84c;margin-bottom:4px;text-transform:uppercase;letter-spacing:2px;text-align:center}
.meta{font-size:10px;letter-spacing:2px;color:#555;margin-bottom:32px;text-transform:uppercase;text-align:center}
.stats{display:flex;gap:16px;margin-bottom:32px;flex-wrap:wrap;justify-content:center}
.stat{background:#0a1416;border:1px solid #15201f;border-radius:8px;padding:16px 24px;text-align:center;min-width:100px}
.stat-n{font-size:32px;font-weight:500;color:#00c896}
.stat-l{font-size:9px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-top:4px}
.stat.si .stat-n{color:#4caf50}
.stat.no .stat-n{color:#e57373}
.actions{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 20px;border:1px solid #1e2c2e;background:transparent;color:#aaa;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn:hover{border-color:#00c896;color:#00c896}
.btn-share{border-color:#25D366;color:#25D366}
.btn-share:hover{background:#25D36620}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.filter-btn{padding:6px 16px;border:1px solid #15201f;background:transparent;color:#666;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit;border-radius:20px}
.filter-btn.active{border-color:#00c896;color:#00c896;background:#00c89612}
#table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 12px;font-size:9px;letter-spacing:2px;color:#555;text-transform:uppercase;border-bottom:1px solid #15201f}
td{padding:12px 12px;border-bottom:1px solid #0e1718;color:#ccc;vertical-align:top}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.badge.si{background:#4caf5020;color:#4caf50;border:1px solid #4caf5040}
.badge.no{background:#e5737320;color:#e57373;border:1px solid #e5737340}
.restricciones{font-size:10px;color:#666;margin-top:4px}
.empty{text-align:center;padding:64px 0;color:#444;font-size:13px}
.mesa-select{background:#0a1416;border:1px solid #15201f;color:#ccc;padding:6px 10px;font-size:11px;font-family:inherit;outline:none;border-radius:4px;cursor:pointer}
.mesa-select:focus{border-color:#00c896}
.mesa-select:disabled{opacity:.35;cursor:not-allowed}
.asis-select.si{color:#4caf50;border-color:#4caf5040}
.asis-select.no{color:#e57373;border-color:#e5737340}
/* Resumen por mesa */
#mesas-wrap{margin:0 auto 20px;max-width:900px}
.mesas-head{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-bottom:10px}
#mesas-cant{width:64px;background:#0a1416;border:1px solid #15201f;color:#fff;padding:6px 8px;font-family:inherit;font-size:12px;border-radius:4px;text-align:center}
.mesas-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mesa-chip{padding:5px 10px;border:1px solid #15201f;background:transparent;color:#888;font-size:10px;letter-spacing:1px;cursor:pointer;font-family:inherit;border-radius:14px}
.mesa-chip.llena{border-color:#e5737360;color:#e57373}
.mesa-chip.sin{border-color:#c9a84c80;color:#c9a84c}
.mesa-chip.active{background:#00c89618;border-color:#00c896;color:#00c896}
/* Confirmado sin mesa: hay que asignarle una */
tr.sin-mesa td{background:rgba(201,168,76,0.08)}
tr.sin-mesa td:first-child{box-shadow:inset 3px 0 0 #c9a84c}
tr.sin-mesa .mesa-select:not(.asis-select){border-color:#c9a84c;color:#c9a84c}
#search{background:#0a1416;border:1px solid #15201f;color:#fff;padding:10px 16px;font-size:12px;font-family:inherit;outline:none;width:100%;max-width:300px;margin:0 auto 16px;display:block}
#search::placeholder{color:#444}
/* Pie igual al de la invitación (tema oscuro) */
footer{padding:60px 24px;text-align:center;border-top:1px solid rgba(255,255,255,0.05);margin-top:48px}
footer p{font-size:11px;color:#888;letter-spacing:2px;text-transform:uppercase}
footer small{font-size:10px;color:rgba(255,255,255,0.3);margin-top:8px;display:block}
footer small a{color:inherit}
#footer-logo{display:none;margin:16px auto 12px;max-height:56px;max-width:180px;object-fit:contain;filter:invert(1)}
</style>
</head>
<body>
<h1 id="panel-titulo">Invitados</h1>
<div class="meta" id="panel-meta"></div>
<div class="stats">
  <div class="stat"><div class="stat-n" id="st-total">—</div><div class="stat-l">Total</div></div>
  <div class="stat si"><div class="stat-n" id="st-si">—</div><div class="stat-l">Confirmados</div></div>
  <div class="stat no"><div class="stat-n" id="st-no">—</div><div class="stat-l">No asisten</div></div>
</div>
<div class="actions">
  <button class="btn" onclick="exportCSV()">⬇ Exportar CSV</button>
  <button class="btn btn-share" onclick="shareUrl()">WhatsApp 📲</button>
</div>
<input id="search" placeholder="Buscar por nombre..." oninput="renderTable()">
<div class="filters">
  <button class="filter-btn active" data-f="todos" onclick="setFilter('todos',this)">Todos</button>
  <button class="filter-btn" data-f="si" onclick="setFilter('si',this)">Confirmados</button>
  <button class="filter-btn" data-f="no" onclick="setFilter('no',this)">No asisten</button>
</div>
<div id="mesas-wrap" style="display:none">
  <div class="mesas-head">
    <span>Mesas</span>
    <label>Cantidad <input id="mesas-cant" type="number" min="1" max="60"></label>
    <button class="btn" style="padding:6px 14px" onclick="saveMesas()">Guardar</button>
  </div>
  <div id="mesas-chips" class="mesas-chips"></div>
</div>
<div id="table-wrap"></div>
<footer>
  <p id="footer-names"></p>
  <img id="footer-logo" alt="Logo">
  <small>Invitación digital · <a id="invite-footer-web" data-brand="web" href="#" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:3px"><span data-brand="nombre">KUERRE</span></a> · <a id="invite-footer-ig" data-brand="ig" href="#" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:3px">@KUERRE.com.ar</a></small>
  <small id="credito-line" data-brand="credito" style="display:none;opacity:.55;font-size:9px;letter-spacing:.06em"><a href="https://kuerre.com.ar" target="_blank" rel="noopener">Sitio realizado por Kuerre · Experiencias digitales para eventos</a></small>
</footer>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug') || '';
const token = params.get('t') || '';
const WORKER = 'https://KUERRE-worker.cristian-romero-digital.workers.dev';
let _all = [];
let _filter = 'todos';
let _mesas = 20, _capacidad = 10;
let _mesaFilter = null; // null = todas, 0 = confirmados sin mesa, n = mesa n

// ── Marca (white-label) — mismo código que invite.html ─────────────────────
function brandIgUrl(v) { return /^https?:/.test(v) ? v : 'https://www.instagram.com/' + String(v).replace(/^@/, ''); }

async function loadBrand(scope, id) {
  const fallback = { nombre: 'KUERRE', slogan: '', logo_url: '', whatsapp: '', instagram: '', web: 'https://kuerre.com.ar', credito: false };
  try {
    const brandPartner = new URLSearchParams(location.search).get('m') || '';
    const r = await fetch(WORKER + '/brand?scope=' + scope + '&id=' + encodeURIComponent(id || '') + (brandPartner ? '&partner=' + encodeURIComponent(brandPartner) : ''));
    if (!r.ok) throw new Error('brand ' + r.status);
    return Object.assign(fallback, await r.json());
  } catch (e) { return fallback; }
}

function applyBrand(b) {
  document.querySelectorAll('[data-brand]').forEach(function (el) {
    const k = el.getAttribute('data-brand');
    if (k === 'nombre') { el.textContent = b.nombre; return; }
    if (k === 'slogan') { if (b.slogan) el.textContent = b.slogan; else el.style.display = 'none'; return; }
    // El filtro y el blend vienen de la marca: las piezas traen un invert(1) en
    // el CSS pensado para el logo de Kuerre, que es oscuro, y un logo ya claro
    // invertido queda negro sobre fondo negro.
    if (k === 'logo')   { if (b.logo_url) { el.src = b.logo_url; el.style.display = ''; if (b.logo_filter) el.style.filter = b.logo_filter; if (b.logo_blend) el.style.mixBlendMode = b.logo_blend; } else el.style.display = 'none'; return; }
    // Ojo: varios de estos anchors arrancan con display:none inline, así que
    // cuando el dato existe hay que mostrarlos explícitamente.
    if (k === 'web')    { if (b.web) { el.href = b.web; el.style.display = ''; } else el.style.display = 'none'; return; }
    if (k === 'ig')     { if (b.instagram) { el.href = brandIgUrl(b.instagram); el.style.display = ''; } else el.style.display = 'none'; return; }
    if (k === 'wa')     { if (b.whatsapp) { el.href = 'https://wa.me/' + b.whatsapp.replace(/\D/g, ''); el.style.display = ''; } else el.style.display = 'none'; return; }
    if (k === 'credito') { el.style.display = b.credito ? '' : 'none'; return; }
  });
}

// Pie igual al de la invitación: nombre del evento, logo (el propio de la
// invitación o el de la marca asignada al cliente), web/IG de la marca y crédito.
async function renderFooter() {
  const [cfgInv, brand] = await Promise.all([
    fetch(WORKER + '/invite/' + slug).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    loadBrand('invite', slug)
  ]);
  document.getElementById('footer-names').textContent = cfgInv.novios || '';
  applyBrand(brand);
  const igEl = document.getElementById('invite-footer-ig');
  if (igEl && brand.instagram) {
    igEl.textContent = '@' + brandIgUrl(brand.instagram)
      .replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/$/, '');
  }
  const le = document.getElementById('footer-logo');
  if (cfgInv.logo_dark) {
    le.src = cfgInv.logo_dark; le.style.display = 'block';
  } else if (brand.logo_url) {
    le.src = brand.logo_url; le.style.display = 'block';
    if (brand.logo_filter) le.style.filter = brand.logo_filter;
    if (brand.logo_blend)  le.style.mixBlendMode = brand.logo_blend;
  }
}

async function init() {
  if (slug) renderFooter();
  if (!slug || !token) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty">URL inválida. Pedile el link al organizador.</div>';
    return;
  }
  document.getElementById('panel-titulo').textContent = slug.split('-').slice(0,-1).join(' ') || 'Invitados';
  document.getElementById('panel-meta').textContent = 'Confirmaciones de asistencia';
  await loadData();
}

async function loadData() {
  try {
    const res = await fetch(WORKER + '/rsvp/' + slug + '?t=' + encodeURIComponent(token));
    if (!res.ok) { document.getElementById('table-wrap').innerHTML = '<div class="empty">Acceso denegado o invitación no encontrada.</div>'; return; }
    const data = await res.json();
    _all = data.responses || [];
    _mesas = data.mesas || 20;
    _capacidad = data.capacidad || 10;
    if (_mesaFilter > _mesas) _mesaFilter = null;
    document.getElementById('mesas-cant').value = _mesas;
    document.getElementById('mesas-wrap').style.display = '';
    updateStats();
    renderMesas();
    renderTable();
  } catch(e) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty">Error al cargar. Intentá de nuevo.</div>';
  }
}

// Confirmados por mesa (los que no asisten no ocupan lugar).
function ocupacion() {
  const occ = {};
  _all.forEach(r => { if (r.asistencia === 'si' && r.mesa) occ[r.mesa] = (occ[r.mesa] || 0) + 1; });
  return occ;
}

function renderMesas() {
  const occ = ocupacion();
  const sinMesa = _all.filter(r => r.asistencia === 'si' && !r.mesa).length;
  const chip = (texto, valor, clase) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mesa-chip' + (clase ? ' ' + clase : '') + (_mesaFilter === valor ? ' active' : '');
    b.textContent = texto;
    b.onclick = () => { _mesaFilter = _mesaFilter === valor ? null : valor; renderMesas(); renderTable(); };
    return b;
  };
  const chips = [chip('Todas', null), chip('Sin mesa (' + sinMesa + ')', 0, sinMesa ? 'sin' : '')];
  for (let n = 1; n <= _mesas; n++) {
    const c = occ[n] || 0;
    chips.push(chip('Mesa ' + n + ' · ' + c + '/' + _capacidad, n, c >= _capacidad ? 'llena' : ''));
  }
  document.getElementById('mesas-chips').replaceChildren(...chips);
}

async function saveMesas() {
  const n = Number(document.getElementById('mesas-cant').value);
  try {
    const res = await fetch(WORKER + '/rsvp/' + slug + '/config?t=' + encodeURIComponent(token), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mesas: n })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { alert('No se pudo cambiar la cantidad de mesas: ' + (data.mensaje || data.error || 'HTTP ' + res.status)); document.getElementById('mesas-cant').value = _mesas; return; }
    _mesas = n;
    if (_mesaFilter > _mesas) _mesaFilter = null;
    renderMesas();
    renderTable();
  } catch(e) {
    alert('No se pudo cambiar la cantidad de mesas. Revisá la conexión.');
  }
}

function setFilter(f, btn) {
  _filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();
  let rows = _all.filter(r => {
    const matchFilter = _filter === 'todos' || r.asistencia === _filter;
    const matchSearch = !q || (r.nombre + ' ' + r.apellido).toLowerCase().includes(q);
    const matchMesa = _mesaFilter === null || (r.asistencia === 'si' && (_mesaFilter === 0 ? !r.mesa : r.mesa === _mesaFilter));
    return matchFilter && matchSearch && matchMesa;
  });
  if (!rows.length) { document.getElementById('table-wrap').innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
  const occ = ocupacion();
  document.getElementById('table-wrap').innerHTML = `<table>
    <thead><tr><th>#</th><th>Nombre</th><th>Asistencia</th><th>Respondió el</th><th>Se modificó el</th><th>Mesa</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr${r.asistencia === 'si' && !r.mesa ? ' class="sin-mesa" title="Confirmado sin mesa asignada"' : ''}>
      <td style="color:#555">${i+1}</td>
      <td>
        <div>${esc(r.nombre)} ${esc(r.apellido)}</div>
        ${r.restricciones ? '<div class="restricciones">🥗 ' + esc(r.restricciones) + '</div>' : ''}
        ${r.mensaje ? '<div class="restricciones">💬 ' + esc(r.mensaje) + '</div>' : ''}
      </td>
      <td><select class="mesa-select asis-select ${r.asistencia === 'si' ? 'si' : 'no'}" onchange="setAsistencia(${r.id}, this.value)">
        <option value="si"${r.asistencia === 'si' ? ' selected' : ''}>Asiste</option>
        <option value="no"${r.asistencia === 'si' ? '' : ' selected'}>No asiste</option>
      </select></td>
      <td style="color:#555;white-space:nowrap">${fmtDate(r.created_at)}</td>
      <td style="color:#555;white-space:nowrap">${r.modificado_at ? fmtDate(r.modificado_at) : '—'}</td>
      <td><select class="mesa-select" onchange="setMesa(${r.id}, this.value)"${r.asistencia === 'si' ? '' : ' disabled title="Solo se asigna mesa a quien asiste"'}>${mesaOptions(r.asistencia === 'si' ? r.mesa : null, occ)}</select></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
// Cada mesa muestra su cupo; las llenas no se pueden elegir (salvo la que ya tiene).
function mesaOptions(current, occ) {
  let opts = '<option value="">Sin mesa</option>';
  for (let n = 1; n <= _mesas; n++) {
    const c = occ[n] || 0;
    const llena = c >= _capacidad && current !== n;
    opts += `<option value="${n}"${current === n ? ' selected' : ''}${llena ? ' disabled' : ''}>Mesa ${n} (${c}/${_capacidad})</option>`;
  }
  return opts;
}
function updateStats() {
  const si = _all.filter(r => r.asistencia === 'si').length;
  document.getElementById('st-total').textContent = _all.length;
  document.getElementById('st-si').textContent = si;
  document.getElementById('st-no').textContent = _all.length - si;
}
async function patchRsvp(id, body) {
  const res = await fetch(WORKER + '/rsvp/' + slug + '/' + id + '?t=' + encodeURIComponent(token), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    const e = new Error(d.mensaje || d.error || 'HTTP ' + res.status);
    e.code = d.error;
    throw e;
  }
}
// Error de guardado: si otra persona cambió al invitado, se avisa y se recarga la lista.
async function onPatchError(e, r, accion) {
  if (e.code === 'conflicto') {
    alert('Otra persona cambió a ' + (r ? r.nombre + ' ' + r.apellido : 'este invitado') + ' mientras editabas. Se actualizó la lista.');
    await loadData();
    return;
  }
  alert('No se pudo ' + accion + ': ' + e.message);
  renderTable();
}
async function setMesa(id, value) {
  const r = _all.find(r => r.id === id);
  try {
    await patchRsvp(id, { mesa: value || null, prev: { asistencia: r.asistencia, mesa: r.mesa } });
    r.mesa = value ? Number(value) : null;
    renderMesas();
    renderTable(); // actualiza el remarcado de "confirmado sin mesa"
  } catch(e) {
    await onPatchError(e, r, 'guardar la mesa');
  }
}
async function setAsistencia(id, value) {
  const r = _all.find(r => r.id === id);
  try {
    await patchRsvp(id, { asistencia: value, prev: { asistencia: r.asistencia, mesa: r.mesa } });
    if (!(r.asistencia === 'si' && value === 'si')) r.mesa = null;
    // Mismo formato que guarda el worker (UTC, sin zona): fmtDate le agrega la Z.
    if (r.asistencia !== value) r.modificado_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
    r.asistencia = value;
    updateStats();
    renderMesas();
    renderTable();
  } catch(e) {
    await onPatchError(e, r, 'cambiar la asistencia');
  }
}
function fmtDate(s) { if (!s) return ''; const d = new Date(s+'Z'); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}) + ' hs'; }

async function exportCSV() {
  // confirm() es sincrónico y va antes de cualquier await: el toque sigue siendo
  // un gesto válido para el menú Compartir del celular.
  const sinMesa = _all.filter(r => r.asistencia === 'si' && !r.mesa);
  if (sinMesa.length) {
    const nombres = sinMesa.slice(0, 15).map(r => '• ' + r.nombre + ' ' + r.apellido).join('\n');
    const resto = sinMesa.length > 15 ? '\n…y ' + (sinMesa.length - 15) + ' más' : '';
    const msg = (sinMesa.length === 1 ? 'Este invitado confirmado no tiene mesa asignada:' : 'Estos ' + sinMesa.length + ' invitados confirmados no tienen mesa asignada:')
      + '\n\n' + nombres + resto + '\n\n¿Exportar igual?';
    if (!confirm(msg)) return;
  }
  const rows = _all.filter(r => _filter === 'todos' || r.asistencia === _filter);
  const header = ['Nombre','Apellido','Asistencia','Restricciones','Mensaje','Mesa','Respondió el','Se modificó el'];
  const csv = [header, ...rows.map(r => [r.nombre, r.apellido, r.asistencia === 'si' ? 'Confirma' : 'No asiste', r.restricciones||'', r.mensaje||'', (r.asistencia === 'si' && r.mesa) || '', fmtDate(r.created_at), fmtDate(r.modificado_at)])].map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const name = 'invitados-' + slug + '.csv';
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  // En el celular (iPhone, navegador de WhatsApp) los links de descarga no bajan
  // nada: se abre el menú Compartir del sistema (Guardar en Archivos, abrir con
  // Excel/Numbers/Sheets, mandar por WhatsApp). En la compu, descarga directa.
  const file = new File([blob], name, { type: 'text/csv' });
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function shareUrl() {
  const url = location.href;
  const wa = 'https://wa.me/?text=' + encodeURIComponent('Podés ver los confirmados acá: ' + url);
  window.open(wa, '_blank');
}

init();
</script>
</body>
</html>
