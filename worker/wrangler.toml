name = "kuerre-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true
routes = [
  { pattern = "kuerre.com.ar/og/*", zone_name = "kuerre.com.ar" }
]

[[d1_databases]]
binding = "KUERRE_DB"
database_name = "kuerre-db"
database_id = "8ea1a29e-942d-40f6-84a3-341e822c4323"

[[kv_namespaces]]
binding = "KUERRE_KV"
id = "d6467ee2136446f48c6bc2527d1e68a4"
preview_id = "6f56db7b0902447d9bd4fcf35fbb17d1"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kuerre-media"

[[rules]]
type = "Text"
globs = ["**/*.html"]

[vars]
# Origen público del worker (para URLs que se sirven desde él, ej. logos en la tarjeta de WhatsApp)
WORKER_ORIGIN = "https://kuerre-worker.cristian-romero-digital.workers.dev"

# Límite de envíos del RSVP público (por IP + evento)
[[ratelimits]]
name = "RSVP_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[triggers]
crons = ["0 8 * * *"]

# Secrets (set via: wrangler secret put <NAME>)
# ADMIN_JWT_SECRET  — clave para firmar tokens de admin
# ADMIN_USER        — usuario admin por defecto
# ADMIN_PASS        — contraseña admin por defecto
# CF_AUTH_TOKEN     — token para sincronización de settings al KV
